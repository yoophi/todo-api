[project]
name = "todo-api"
version = "0.1.0"
description = "A simple Todo API REST service"
authors = [
    { name = "Pyunghyuk Yoo", email = "pyunghyuk@likelion.net" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.2",
    "flask-sqlalchemy>=3.1.1",
    "flask-swagger>=0.2.14",
    "flask-cors>=6.0.1",
    "flask-marshmallow>=1.3.0",
    "marshmallow-sqlalchemy>=1.0.0",
    "flask-migrate>=4.1.0",
    "psycopg2-binary>=2.9.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
